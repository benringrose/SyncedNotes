# SyncedNotes with Docker Compose, reached through a Cloudflare Tunnel. The image is built from the Git repository
# (see Dockerfile), so this folder is all a server needs.
#
# No port is published on the server. The app is on an internal Docker network that nothing outside this project can
# reach, and that has no route out. The cloudflared container is on that network too, and it opens an outbound
# connection to Cloudflare, which sends visitors' requests back through it. Cloudflare serves HTTPS for DOMAIN, so the
# server needs no open inbound ports and no certificate.
#
#   1. In the Cloudflare dashboard, create a tunnel, and add a published application route from DOMAIN to the service
#      URL http://syncednotes:8080.
#   2. cp .env.example .env, then set GIT_PAT, TUNNEL_TOKEN and DOMAIN.
#   3. docker compose up -d --build
#
# Run the same command again to update the app to the latest commit.

name: syncednotes

services:
  syncednotes:
    build:
      context: .
      args:
        GIT_URL: "${GIT_REPOSITORY:-https://github.com/benringrose/SyncedNotes.git}#${GIT_REF:-main}"
      secrets:
        - source: git_pat
          target: GIT_AUTH_TOKEN
    image: syncednotes:latest
    restart: unless-stopped
    environment:
      Auth__Registration: ${REGISTRATION:-FirstUserOnly}
      Passkeys__ServerDomain: ${DOMAIN:-}
      # Use the visitor's address and scheme from the X-Forwarded-* headers that Cloudflare sets. That's safe because
      # only cloudflared can connect to the app. Don't publish a port for this service while this is set.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    # No "ports:" on purpose. The app is reachable only on the internal network, so the only way in is the tunnel.
    networks:
      - internal
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Connects out to Cloudflare and passes requests for DOMAIN on to the app. It's the only container on both networks.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env to the token of your Cloudflare Tunnel}
    networks:
      - internal
      - outbound
    depends_on:
      - syncednotes
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # Docker gives an internal network no gateway: its containers can reach each other, but nothing else can reach
  # them, they can't reach the internet, and ports can't be published from it.
  internal:
    internal: true
  # cloudflared's route out to Cloudflare.
  outbound:

secrets:
  git_pat:
    environment: GIT_PAT

volumes:
  data:
